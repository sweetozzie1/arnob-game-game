<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكتب ولوّن الحروف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎨 اكتب ولوّن الحروف</h1>
        <a href="index.html" class="back-btn">الرئيسية 🏠</a>
    </header>

    <div class="container">
        <h2>مرر القلم فوق الحرف لتلوينه:</h2>
        <div class="color-palette">
            <div class="color-dot" style="background: #ff6b6b;" onclick="setPenColor('#ff6b6b')"></div>
            <div class="color-dot" style="background: #4ecdc4;" onclick="setPenColor('#4ecdc4')"></div>
            <div class="color-dot" style="background: #1a535c;" onclick="setPenColor('#1a535c')"></div>
            <div class="color-dot" style="background: #ff9f1c;" onclick="setPenColor('#ff9f1c')"></div>
            <div class="color-dot" style="background: #9b5de5;" onclick="setPenColor('#9b5de5')"></div>
        </div>

        <canvas id="drawCanvas" width="320" height="320"></canvas>

        <div class="options-grid">
            <button class="option-btn" style="background:#4ecdc4; font-size:1.2rem;" onclick="clearCanvas()">مسح 🧹</button>
            <button class="option-btn" style="font-size:1.2rem;" onclick="nextDrawLetter()">الحرف التالي ⬅️</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
