<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مغامرة الرياضيات مع الأصدقاء</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <h1>🐾 مغامرة الأرقام مع أرنوب 🐰</h1>
      <div class="score-board">النقاط: <span id="score">0</span> ⭐</div>
    </div>

    <!-- شخصية الحيوان الأليف -->
    <div class="mascot-area">
      <div id="mascot" class="mascot">🐰</div>
      <div id="speech-bubble" class="speech-bubble">مرحباً يا بطل! اضغط على أي رقم لنبدأ!</div>
    </div>

    <!-- منطقة السؤال -->
    <div class="question-box">
      <button id="speak-btn" class="speak-btn" title="اسمع السؤال">🔊 اسمع السؤال</button>
      <p id="question-text">كم يساوي: 2 + 3 ؟</p>
      <div id="visual-items" class="visual-items">🍎🍎 + 🍎🍎🍎</div>
    </div>

    <!-- أزرار الإجابات -->
    <div id="options-container" class="options-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
