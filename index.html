<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مغامرة الأرقام مع أرنوب</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <header class="game-header">
      <h1>مغامرة الأرقام مع أرنوب 🐰🐾</h1>
      <div class="score-badge">النقاط: <span id="score">0</span> ⭐</div>
    </header>

    <section class="mascot-box">
      <div id="mascot" class="mascot">🐰</div>
      <p id="bubble" class="bubble">مرحباً يا بطل! اختر الإجابة الصحيحة!</p>
    </section>

    <div class="mode-selector" role="group" aria-label="اختر نوع العملية">
      <button type="button" class="mode-btn active" data-mode="add">جمع (+)</button>
      <button type="button" class="mode-btn" data-mode="sub">طرح (-)</button>
    </div>

    <section class="question-box">
      <div class="question-top">
        <p id="question-text" class="question-text">كم يساوي: 2 + 3 ؟</p>
        <button id="speak-btn" type="button" class="speak-btn">🔊 اسمع السؤال</button>
      </div>
      <div id="visual-items" class="visual-items"></div>
      <div id="choices" class="choices"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
