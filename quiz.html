<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الصور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initQuizPage()">
    <header>
        <h1>🎯 تحدي الصور</h1>
        <div class="score-badge">النقاط: <span id="score">0</span></div>
        <a href="index.html" class="back-btn">الرئيسية 🏠</a>
    </header>

    <div class="container">
        <h2>ما هو الحرف الأول لهذه الصورة؟</h2>
        <div class="quiz-emoji" id="quizEmoji">🍎</div>
        <button onclick="speakCurrentWord()" style="padding: 8px 15px; border-radius: 10px; border:none; background:#4ecdc4; color:white; cursor:pointer;">🔊 اسمع الكلمة</button>
        
        <div class="options-grid" id="quizOptions"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
